<!doctype html>
<html><head><meta charset="utf-8"><title>geom selftest</title>
<style>
  body { margin:0; font:14px system-ui; }
  .slide { width:1280px; height:720px; display:grid;
           grid-template-columns:repeat(16,minmax(0,1fr)); grid-template-rows:repeat(9,minmax(0,1fr)); }
  .block { box-sizing:border-box; padding:8px; min-width:0; min-height:0; }
  .block.grid { display:grid; gap:8px; }
  .pass { color:#16a34a } .fail { color:#dc2626 }
</style></head><body>
<h1 id="result">running…</h1><ol id="log"></ol>
<section class="slide" id="s1">
  <div class="block" id="a" style="grid-area:1/1/3/17">title</div>
  <div class="block" id="b" style="grid-area:3/1/9/9"><p style="height:2000px">tall</p></div>
  <div class="block grid" id="c" style="grid-area:3/9/9/17;grid-template-columns:1fr 1fr">
    <div class="block" id="c1">x</div><div class="block" id="c2">y</div>
  </div>
  <div class="block" id="d" style="grid-area:8/7/10/11">overlaps b and c</div>
</section>
<section class="slide" id="s2">
  <div class="block" id="e" style="grid-row:2/4;grid-column:3/span 2">span-based</div>
  <div class="block" id="f" style="grid-area:1/1/-1/-1"></div>
</section>
<script src="geom.js"></script>
<script src="ops.js"></script>
<script>
  const G = PPTGeom, log = document.getElementById('log'); let pass = 0, total = 0;
  function check(name, got, want) {
    total++; const ok = JSON.stringify(got) === JSON.stringify(want); if (ok) pass++;
    const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail';
    li.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}: got ${JSON.stringify(got)}${ok ? '' : ' want ' + JSON.stringify(want)}`;
    log.appendChild(li);
  }
  const near = (r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, Math.round(v / 2) * 2]));
  const slide = document.getElementById('s1');

  check('cells full', G.rectToCells({x:0,y:0,w:1280,h:720}), '1-16/1-9');
  check('cells right half', G.rectToCells({x:640,y:160,w:640,h:480}), '9-16/3-8');
  check('cells zero-size on boundary', G.rectToCells({x:80,y:80,w:0,h:0}), '2-2/2-2');
  check('cells straddle', G.rectToCells({x:79,y:0,w:2,h:1}), '1-2/1-1');

  const half = {left:100, top:50, width:640, height:360};   // slide shown at 50% (narrow window)
  check('clientToSlide scaled', G.clientToSlide(half, 100, 50, 420, 230), {x:0,y:0,w:640,h:360});
  check('clientToSlide reversed drag', G.clientToSlide(half, 420, 230, 100, 50), {x:0,y:0,w:640,h:360});
  check('clientToSlide clamps', G.clientToSlide(half, 0, 0, 2000, 2000), {x:0,y:0,w:1280,h:720});
  check('slideToClient scaled', G.slideToClient(half, {x:640,y:360,w:640,h:360}), {left:420,top:230,width:320,height:180});

  check('elementRect c', near(G.elementRect(slide.getBoundingClientRect(), document.getElementById('c'))), {x:640,y:160,w:640,h:480});
  check('hit inner first', G.hitBlocks(slide, {x:700,y:200,w:10,h:10}), ['c1','c']);
  check('hit blank area', G.hitBlocks(slide, {x:1270,y:710,w:0,h:0}), []);
  check('hit all', G.hitBlocks(slide, {x:0,y:0,w:1280,h:720}).sort(), ['a','b','c','c1','c2','d']);

  const issues = G.lint(slide).map(i => `${i.kind}:${i.block}${i.other ? '/' + i.other : ''}`).sort();
  check('lint', issues, ['overflow:b', 'overlap:d/b', 'overlap:d/c']);
  document.getElementById('d').removeAttribute('id');
  check('lint missing id', G.lint(slide).filter(i => i.kind === 'missing-id').length, 1);

  // ---- grid drag maths ----
  check('gridOf inline', G.gridOf(document.getElementById('c')), {r1:3,c1:9,r2:9,c2:17});
  check('gridOf fallback', G.gridOf(document.getElementById('e')), {r1:2,c1:3,r2:4,c2:5});
  const g0 = {r1:3,c1:2,r2:6,c2:9};
  check('dragGrid move snaps', G.dragGrid(g0, 85, -10, 'move'), {r1:3,c1:3,r2:6,c2:10});
  check('dragGrid move clamps', G.dragGrid(g0, 2000, 2000, 'move'), {r1:7,c1:10,r2:10,c2:17});
  check('dragGrid resize min 1 cell', G.dragGrid(g0, -1000, 0, 'se'), {r1:3,c1:2,r2:6,c2:3});
  check('dragGrid resize nw clamps', G.dragGrid(g0, -1000, -1000, 'nw'), {r1:1,c1:1,r2:6,c2:9});
  check('gridStr', G.gridStr(g0), '3/2/6/9');
  check('gridOf negative lines use layout', G.gridOf(document.getElementById('f')), {r1:1,c1:1,r2:10,c2:17});

  // ---- ops ----
  const O = PPTOps;
  const SRC = '<!doctype html><html><head></head><body>\n<section class="slide" id="t1"><div class="block" id="a" style="grid-area:1/1/3/17"><h1 style="color:red;font-size:40px">T</h1></div><div class="obj" id="o1"></div></section>\n<section class="slide" id="t2"></section>\n</body></html>';
  const mk = () => new DOMParser().parseFromString(SRC, 'text/html');
  const ser = (d) => d.documentElement.outerHTML;
  const d = mk(), A = () => d.getElementById('a');
  check('ops setStyle ok / rejects unknown prop', [O.apply(d, {op:'setStyle', target:'a', args:{style:{background:'#ef4444'}}}),
    O.apply(d, {op:'setStyle', target:'a', args:{style:{position:'fixed'}}})], [true, false]);
  check('ops setStyle value', A().style.background, 'rgb(239, 68, 68)');
  O.apply(d, {op:'setStyle', target:'a', args:{style:{color:'#0000ff'}, deep:true}});
  check('ops deep style strips inner', [A().style.color, d.querySelector('#a h1').getAttribute('style')], ['rgb(0, 0, 255)', 'font-size: 40px;']);
  O.apply(d, {op:'setStyle', target:'a', args:{style:{background:null}}});
  check('ops setStyle clears', A().style.background, '');
  O.apply(d, {op:'setGrid', target:'a', args:{grid:'0/15/0/40'}});
  check('ops setGrid clamps', A().style.gridArea, '1 / 15 / 2 / 17');
  O.apply(d, {op:'insertBlock', args:{id:'b', slideId:'t1', grid:'4/6/6/12', html:'<p>x</p>'}});
  check('ops insertBlock goes before objects', [...d.getElementById('t1').children].map((n) => n.id), ['a', 'b', 'o1']);
  check('ops insertBlock refuses duplicate id', O.apply(d, {op:'insertBlock', args:{id:'b', slideId:'t1', grid:'1/1/2/2'}}), false);
  O.apply(d, {op:'remove', target:'b'});
  check('ops remove', d.getElementById('b'), null);
  check('ops missing target', O.apply(d, {op:'setHTML', target:'zz', args:{html:'x'}}), false);
  check('ops unknown op', O.apply(d, {op:'explode', target:'a'}), false);
  O.apply(d, {op:'insertSlide', args:{id:'t9', afterId:'t1'}});
  check('ops insertSlide after', [...d.querySelectorAll('section.slide')].map((s) => s.id), ['t1', 't9', 't2']);
  O.apply(d, {op:'removeSlide', target:'t9'}); O.apply(d, {op:'removeSlide', target:'t2'});
  check('ops keeps the last slide', O.apply(d, {op:'removeSlide', target:'t1'}), false);
  const d3 = mk(); O.apply(d3, {op:'setStyle', target:'a', args:{style:{'font-weight':'400'}, deep:true}});
  check('ops deep weight overrides heading tags', d3.querySelector('#a h1').getAttribute('style'), 'color: red; font-size: 40px; font-weight: inherit;');
  check('ops newId unique', /^b-[0-9a-z]{6}$/.test(O.newId(d, 'b-')), true);
  const SEQ = [
    {op:'setStyle', target:'a', args:{style:{'font-size':'32px', 'text-align':'center'}, deep:true}},
    {op:'setGrid', target:'a', args:{grid:'2/2/5/10'}},
    {op:'insertBlock', args:{id:'n1', slideId:'t1', grid:'5/2/7/8', html:'<p>新</p>'}},
    {op:'setHTML', target:'n1', args:{html:'<p><b>改</b></p>'}},
    {op:'insertSlide', args:{id:'t3', afterId:'t1'}},
    {op:'removeSlide', target:'t2'},
  ];
  const d1 = mk(), d2 = mk();
  SEQ.forEach((op) => { O.apply(d1, op); O.apply(d2, op); });
  check('ops deterministic on two copies', ser(d1) === ser(d2) && ser(d1) !== ser(mk()), true);

  const r = document.getElementById('result');
  r.textContent = `${pass === total ? 'PASS' : 'FAIL'} ${pass}/${total}`; r.className = pass === total ? 'pass' : 'fail';
</script>
</body></html>
